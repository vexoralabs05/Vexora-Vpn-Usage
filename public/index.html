<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>Vexora Labs Usage Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f6f8;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font-weight:900;letter-spacing:.15em}.brand small{display:block;color:#9aa3ad;font-size:10px}.panel,.order{background:#14181d;border:1px solid #2b323a;border-radius:18px;padding:20px;margin-bottom:14px}.login{max-width:440px;margin:9vh auto}h1{font-size:28px;margin:8px 0}input{width:100%;padding:14px;margin-top:10px;background:#080a0d;color:white;border:1px solid #39424c;border-radius:10px;font:inherit}button{padding:13px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:15px;background:#f2f4f6;color:#08090b}.muted,small{color:#9aa3ad}.err{display:none;color:#ffaaaa;margin-top:12px}.head{display:flex;justify-content:space-between;gap:10px}.status{border:1px solid #36704e;color:#8de9b4;border-radius:20px;padding:4px 9px;font:10px monospace}.off{color:#ffaaaa;border-color:#71343b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.stat{background:#1d232a;border-radius:10px;padding:12px;min-width:0}.stat b{display:block;overflow-wrap:anywhere;margin-top:5px}.bar{height:7px;background:#343b43;border-radius:8px;margin-top:15px}.bar span{display:block;height:100%;background:#55d995;border-radius:8px}.actions{text-align:right}.actions button{background:#222a32;color:white;border:1px solid #3a424b}.foot{text-align:center;color:#89929c;font-size:11px;margin-top:25px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.panel,.order{padding:16px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">VEXORA LABS<small>Customer usage portal</small></div><span class="muted">PORTAL ONLINE</span></header>
<section class="panel login" id="login"><small>SUBSCRIBER ACCESS</small><h1>Check your VPN usage</h1><p class="muted">Enter the registered phone number. Every subscription connected to that number will appear separately.</p><form id="form"><label for="phone">Phone number</label><input id="phone" type="tel" inputmode="tel" placeholder="07X XXX XXXX" required><button class="primary" id="go">View my subscriptions</button><div class="err" id="err"></div></form></section><section id="summary" class="panel" hidden><small>ACCOUNT OVERVIEW</small><h1>Your subscriptions</h1><p class="muted" id="summaryText"></p></section><div id="orders"></div><div class="actions" id="actions" hidden><button id="refresh">Refresh</button> <button id="logout">Log out</button></div><footer class="foot">© Vexora Labs · vexoralabs.com.lk · WhatsApp +94 72 739 7294</footer></main>
<script>const $=x=>document.getElementById(x);let phone='';function esc(x){return String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function card(d){if(d.error)return `<article class="order"><b>${esc(d.plan)}</b><p class="muted">${esc(d.error)}</p></article>`;return `<article class="order"><div class="head"><div><small>${esc(d.plan)} · ${esc(d.gb)}</small><h2>${esc(d.name)}</h2><small>Subscription ${esc(d.id)}</small></div><span class="status ${d.enabled?'':'off'}">${esc(d.status)}</span></div><div class="grid">${[['Used',d.used],['Total',d.total],['Remaining',d.remaining],['Expiry',d.expiry],['Upload',d.upload],['Download',d.download],['Last online',d.lastOnline],['Connection',d.online?'Online':'Offline']].map(x=>`<div class="stat"><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('')}</div><div class="bar"><span style="width:${d.pct}%"></span></div><small>${Number(d.pct).toFixed(1)}% used</small></article>`;}async function load(){$('go').disabled=true;$('go').textContent='Loading…';$('err').style.display='none';try{const r=await fetch('/api/usage?phone='+encodeURIComponent(phone)),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Request failed');$('orders').innerHTML=d.orders.map(card).join('');$('summaryText').textContent=d.orders.length+' subscription(s) found · phone ending '+d.phoneLast4+' · updated '+new Date(d.fetchedAt).toLocaleTimeString();$('summary').hidden=false;$('login').hidden=true;$('actions').hidden=false;}catch(e){$('err').textContent=e.message;$('err').style.display='block';}finally{$('go').disabled=false;$('go').textContent='View my subscriptions';}}$('form').addEventListener('submit',e=>{e.preventDefault();phone=$('phone').value;load()});$('refresh').onclick=load;$('logout').onclick=()=>{phone='';$('phone').value='';$('orders').innerHTML='';$('summary').hidden=true;$('actions').hidden=true;$('login').hidden=false;};</script></body></html>
